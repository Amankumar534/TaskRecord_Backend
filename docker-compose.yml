
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taskrecord_backend
    restart: always

    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

    volumes:
      - .:/app

    ports:
      - "8001:8001"

    env_file:
      - .env

    environment:
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      DATABASE_URL: ${DATABASE_URL}

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}

      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]'
